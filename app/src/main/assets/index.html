<!DOCTYPE html>

<script>
/* --- Solo en la APK: voz, copiar y botón «atrás» de Android --- */
(function(){
  if(!window.AndroidApp)return;
  document.documentElement.classList.add("is-apk");
  // Leer en voz alta con la voz del celular (el WebView de Android no trae speechSynthesis)
  var q={},n=0;
  function U(t){this.text=String(t||"");this.rate=1;this.pitch=1;this.volume=1;this.lang="es-MX";this.voice=null;this.onend=null;this.onerror=null;this.onstart=null;}
  var S={speaking:false,paused:false,pending:false,onvoiceschanged:null,
    getVoices:function(){return [{name:"Voz del celular",lang:"es-MX",localService:true,default:true,voiceURI:"android"}];},
    addEventListener:function(){},removeEventListener:function(){},
    speak:function(u){var id="u"+(++n);q[id]=u;S.speaking=true;try{AndroidApp.speak(u.text,u.rate||1,id);}catch(e){window.__ttsDone(id,true);}},
    cancel:function(){q={};S.speaking=false;try{AndroidApp.stopSpeak();}catch(e){}},
    pause:function(){S.paused=true;try{AndroidApp.stopSpeak();}catch(e){}},
    resume:function(){S.paused=false;}};
  window.__ttsDone=function(id,err){var u=q[id];delete q[id];if(!Object.keys(q).length)S.speaking=false;if(!u)return;var f=err?u.onerror:u.onend;if(typeof f==="function")try{f({type:err?"error":"end"});}catch(e){}};
  try{Object.defineProperty(window,"speechSynthesis",{value:S,configurable:true});}catch(e){window.speechSynthesis=S;}
  window.SpeechSynthesisUtterance=U;
  // Copiar al portapapeles
  try{var cw=function(t){try{AndroidApp.copy(String(t));return Promise.resolve();}catch(e){return Promise.reject(e);}};
    if(navigator.clipboard)navigator.clipboard.writeText=cw;else Object.defineProperty(navigator,"clipboard",{value:{writeText:cw}});}catch(e){}
  // Barras del sistema (hora/batería arriba y botones de Android abajo) con los colores del tema de la app
  var lastBars="";
  function toHex(c){var m=String(c||"").match(/[\d.]+/g);if(!m||m.length<3)return null;if(m.length>3&&+m[3]<0.5)return null;
    return "#"+[0,1,2].map(function(i){var v=Math.round(+m[i]).toString(16);return v.length<2?"0"+v:v;}).join("");}
  function lum(h){return (0.299*parseInt(h.substr(1,2),16)+0.587*parseInt(h.substr(3,2),16)+0.114*parseInt(h.substr(5,2),16))/255;}
  function syncBars(){try{if(!document.body)return;
    var top=toHex(getComputedStyle(document.body).backgroundColor)||toHex(getComputedStyle(document.documentElement).backgroundColor);if(!top)return;
    var tabs=document.getElementById("tabs");var bot=(tabs&&toHex(getComputedStyle(tabs).backgroundColor))||top;
    var k=top+bot;if(k===lastBars)return;lastBars=k;AndroidApp.setBars(top,lum(top)>0.6,bot,lum(bot)>0.6);}catch(e){}}
  document.addEventListener("DOMContentLoaded",syncBars);window.addEventListener("load",syncBars);setInterval(syncBars,700);
  try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",function(){lastBars="";setTimeout(syncBars,50);});}catch(e){}
  // Pausar voz y música al salir de la app
  window.appPause=function(){};
  // Botón «atrás» de Android
  window.appBack=function(){
    var m=document.querySelectorAll(".modal");if(m.length){m[m.length-1].remove();return true;}
    var r=document.getElementById("root");if(!r)return false;
    var b=r.querySelector("#back,#bqback,#cback,#mapback,#mback,#mfback,#pbback,#pjback,#pmback,#snback,[data-eback],[data-oback]");
    if(b){b.click();return true;}
    var mb=r.querySelector("[data-mas-back]");if(mb){mb.click();return true;}
    var on=document.querySelector("#tabs [data-go].on"),first=document.querySelector("#tabs [data-go]");
    if(on&&first&&on!==first){first.click();window.scrollTo(0,0);return true;}
    return false;
  };
})();
</script>

<style id="css">

*{box-sizing:border-box}

let writing=null, pendingCore=false;
async function pushCore(){
  if(!cloud)return;
  if(writing){pendingCore=true;return writing;}
  writing=(async()=>{
    do{ pendingCore=false;
      try{await cloud.estado.set(JSON.parse(JSON.stringify(core())));}
      catch(e){cloudFail(e);break;}
    }while(pendingCore&&cloud);
  })();
  try{await writing;}finally{writing=null;}
}
function cloudFail(e){
  const c=e&&e.code;
  if(c==="unavailable"||c==="resource_exhausted"){toast("Sin conexión; se guardó en este navegador.");return;}
  if(c==="quota_exceeded"){toast("El espacio de la app está lleno; se guardó en este navegador.");return;}
  cloud=null; toast("Tu avance se guardará en este navegador.");
}
async function persist(msg){
  saveLocal();

async function finish(){
  const p=state.plan,c=state.cur,d=state.draft;
  const filled=activeFields().filter(f=>f[3]&&!(d[f[0]]||"").trim());
  if(filled.length && !(await ask("Faltan algunas partes",`Aún no llenas: ${filled.map(f=>f[1]).join(", ")}. ¿Terminar así?`,"Terminar")))return;
  const entry={id:Date.now(),date:new Date().toISOString(),ref:refOf(c,p.mode),link:linkOf(c,p.mode),fields:JSON.parse(JSON.stringify(d))};
  state.entries.unshift(entry); cloudAddEntry(entry);
  // avanzar
  const book=BOOKS[c.bookIdx];
  let next;
  if(p.mode==="capitulo"||c.endCh){
    next={bookIdx:c.bookIdx,ch:c.ch+1,v:1};
    if(next.ch>book[2]){next.bookIdx=(c.bookIdx+1)%BOOKS.length;next.ch=1;}
  } else next={bookIdx:c.bookIdx,ch:c.ch,v:(c.vEnd||c.v)+1};
  next.vEnd=p.mode==="pasaje"?next.v+(p.size||5)-1:null; next.endCh=false;
  const finishedBook=next.bookIdx!==c.bookIdx;
  state.cur=next; state.draft=emptyDraft(); editPasaje=false;
  render(); window.scrollTo(0,0);
  persist(finishedBook?`¡Terminaste ${book[0]}! Sigues con ${BOOKS[next.bookIdx][0]}.`:"¡Devocional terminado! Mañana sigues en "+refOf(next,p.mode));
}


/* ---------- Historial ---------- */
function fmtDate(iso){try{return new Date(iso).toLocaleDateString("es-MX",{weekday:"short",day:"numeric",month:"short",year:"numeric"});}catch(e){return iso;}}
let histQuery="", histMode="dev";buscQ="";estSel=null;estLec=null;
function allKeyVerses(){
  const out=[];
  state.entries.forEach(e=>{
    String(e.fields.versiculo||"").split(/\n{2,}/).map(x=>x.trim()).filter(Boolean).forEach(txt=>{
      const m=txt.match(/\(([^()]+?)\s(\d+):(\d+)(?:[–-](\d+))?\)\s*$/);
      let bi=-1,ch=0,v=0,ref=e.ref;
      if(m){bi=BOOKS.findIndex(b=>b[0]===m[1].trim());ch=+m[2];v=+m[3];ref=`${m[1].trim()} ${m[2]}:${m[3]}${m[4]?"–"+m[4]:""}`;}
      if(bi<0){bi=BOOKS.findIndex(b=>e.ref.startsWith(b[0]+" "));const mm=e.ref.match(/(\d+)(?::(\d+))?/);if(mm){ch=+mm[1];v=+(mm[2]||0);}}
      const body=m?txt.slice(0,m.index).trim().replace(/^[“"]|[”"]$/g,""):txt;
      out.push({bi,ch,v,ref,body,entry:e});
    });
  });
  // quitar repetidos (mismo versículo guardado dos veces)
  const seen=new Set();
  return out.filter(x=>{const k=x.ref+"|"+x.body;if(seen.has(k))return false;seen.add(k);return true;})
    .sort((a,b)=>(a.bi-b.bi)||(a.ch-b.ch)||(a.v-b.v));
}
function drawKeyList(){
  const q=norm(histQuery.trim()), list=$("#hlist"); if(!list)return;
  const all=allKeyVerses().filter(x=>!q||norm(x.body+" "+x.ref).includes(q));
  $("#hcount").textContent=all.length?`${all.length} versículo${all.length===1?"":"s"} clave`:(q?"No se encontró nada con esa búsqueda.":"");
  if(!all.length&&!q){list.innerHTML=`<div class="card muted">Aún no guardas versículos clave. En la pestaña Hoy, toca el número de un versículo para agregarlo.</div>`;return;}
  let html="",lastBook=null;
  all.forEach((x,i)=>{const bn=x.bi>=0?BOOKS[x.bi][0]:"Otros";
    if(bn!==lastBook){html+=`<h3 class="kbook">${esc(bn)}</h3>`;lastBook=bn;}
    html+=`<div class="kv"><div class="kt">“${esc(x.body)}”</div><div class="kr"><b>${esc(x.ref)}</b> · ${esc(fmtDate(x.entry.date))}</div>
      <div class="acts"><button data-kopen="${x.entry.id}">Ver devocional</button><button data-kcopy="${i}">Copiar</button></div></div>`;});
  list.innerHTML=html;
  list.querySelectorAll("[data-kopen]").forEach(b=>b.onclick=()=>{viewEntry=+b.dataset.kopen;renderHistory();window.scrollTo(0,0);});
  list.querySelectorAll("[data-kcopy]").forEach(b=>b.onclick=async()=>{const x=all[+b.dataset.kcopy];try{await navigator.clipboard.writeText(`“${x.body}” (${x.ref})`);toast("Versículo copiado");}catch(_){toast("No se pudo copiar");}});
}
const norm=t=>String(t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
function drawHistList(){
  if(histMode==="keys")return drawKeyList();
  const q=norm(histQuery.trim()), list=$("#hlist"); if(!list)return;
  const res=[];
  for(const e of state.entries){
    if(!q){res.push([e,""]);continue;}
    const parts=[e.ref,BOOKS.find(b=>e.ref.startsWith(b[0]))?.[0]||"",...FIELDS.map(f=>e.fields[f[0]]),...Object.values(e.fields.notas||{}),e.fields.pasaje];
    let hit=null;
    for(const t of parts){const n=norm(t),i=n.indexOf(q);if(i>=0){hit=[String(t),i];break;}}
    if(!hit)continue;
    const [t,i]=hit, a=Math.max(0,i-30), b=Math.min(t.length,i+q.length+50);
    const snip=(a>0?"…":"")+esc(t.slice(a,i))+"<mark>"+esc(t.slice(i,i+q.length))+"</mark>"+esc(t.slice(i+q.length,b))+(b<t.length?"…":"");
    res.push([e,snip.replace(/\n/g," ")]);
  }
  $("#hcount").textContent=q?(res.length?`${res.length} resultado${res.length===1?"":"s"}`:"No se encontró nada con esa búsqueda."):"";
  list.innerHTML=res.map(([e,sn])=>`<button class="hitem" data-id="${e.id}"><div><b>${esc(e.fields.titulo||e.ref)}</b><div class="d">${esc(e.ref)} · ${esc(fmtDate(e.date))}</div>${sn?`<div class="snip">${sn}</div>`:""}</div><span class="muted">›</span></button>`).join("");
  list.querySelectorAll(".hitem").forEach(el=>el.onclick=()=>{viewEntry=+el.dataset.id;renderHistory();window.scrollTo(0,0);});
}
function renderHistory(){
  if(viewEntry){const e=state.entries.find(x=>x.id===viewEntry); if(e)return renderEntry(e); viewEntry=null;}
  const E=state.entries;
  const books=new Set(E.map(e=>e.ref.replace(/\s\d.*$/,""))).size;
  root.innerHTML=`
  <header class="top"><div class="brand">${logo()}<div><h1>Historial</h1><div class="sub">Tus devocionales terminados</div></div></div><button class="gear" data-look="1" aria-label="Apariencia" title="Apariencia">🎨</button></header>
  <div class="card"><div class="stat"><div><b>${E.length}</b><span>devocionales</span></div><div><b>${books}</b><span>libros</span></div><div><b>${streak()}</b><span>días seguidos</span></div></div></div>
  ${calendarHtml()}
  ${E.length?`<div class="chips tabs2"><button class="chip ${histMode==="dev"?"on":""}" data-hm="dev">🗂️ Devocionales</button><button class="chip ${histMode==="keys"?"on":""}" data-hm="keys">⭐ Mis versículos clave</button></div>`:""}
  ${E.length?`<div class="search"><span>🔍</span><input type="search" id="hq" placeholder="Buscar palabra o libro (ej. perdón, Salmos)" value="${esc(histQuery)}"></div><div id="hcount" class="sub" style="margin-bottom:8px"></div><div class="hist" id="hlist"></div>`
  :`<div class="card muted">Aún no terminas ningún devocional. ¡El primero está en la pestaña Hoy!</div>`}`;
  if(E.length){ drawHistList(); $("#hq").addEventListener("input",e=>{histQuery=e.target.value;drawHistList();}); }
  root.querySelectorAll("[data-hm]").forEach(b=>b.onclick=()=>{histMode=b.dataset.hm;renderHistory();});
}
function streak(){
  const days=new Set(state.entries.map(e=>new Date(e.date).toDateString()));
  let n=0,dt=new Date(); if(!days.has(dt.toDateString()))dt.setDate(dt.getDate()-1);
  while(days.has(dt.toDateString())){n++;dt.setDate(dt.getDate()-1);}
  return n;
}
function renderEntry(e){
  root.innerHTML=`
  <button class="btn ghost" id="back" style="margin-bottom:12px">‹ Volver</button>
  <div class="card read">
    <div class="sub">${esc(fmtDate(e.date))}</div>
    <h1 style="margin:4px 0 2px">${esc(e.fields.titulo||e.ref)}</h1>

/* ---------- Preguntas para grupo pequeño ---------- */
function groupQuestions(e){
  const f=e.fields, cut=t=>{t=String(t||"").trim().replace(/\s+/g," ");return t.length>140?t.slice(0,137)+"…":t;}, Q=[];
  Q.push(`Lean juntos ${e.ref}. ¿Qué palabra o frase les llamó más la atención y por qué?`);
  Q.push(`¿Qué está pasando en este pasaje? ¿Quién habla y a quién?`);
  Q.push(`¿Qué nos enseña este pasaje acerca de Dios?${f.mensaje?` (Yo anoté: «${cut(f.mensaje)}»)`:""}`);
  Q.push(f.mandato?`El pasaje nos pide: «${cut(f.mandato)}». ¿Qué tan difícil es obedecer esto hoy y por qué?`:`¿Hay algo que Dios nos pide hacer o dejar de hacer en este pasaje?`);
  if(f.promesa)Q.push(`¿Cómo nos anima esta promesa: «${cut(f.promesa)}»? ¿En qué situación la necesitas?`);
  Q.push(`¿Qué paso concreto vas a dar esta semana a partir de lo que leímos?`);
  Q.push(`¿Cómo podemos orar unos por otros con lo que aprendimos?`);
  const kv=String(f.versiculo||"").trim();
  return `👥 Preguntas para grupo — ${e.ref}${f.titulo?`\n${f.titulo}`:""}${kv?`\n\n⭐ Versículos clave:\n${kv}`:""}\n\n`+Q.map((q,i)=>`${i+1}. ${q}`).join("\n\n");
}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function triviaBooks(){const m=new Map();TRIVIA.forEach(q=>m.set(q[0],(m.get(q[0])||0)+1));return BOOKS.map(b=>b[0]).filter(n=>m.has(n)).map(n=>[n,m.get(n)]);}
function startTrivia(book,qs){
  const pool=qs||(book==="__all"?TRIVIA:TRIVIA.filter(q=>q[0]===book));
  const pick=shuffle(pool).slice(0,Math.min(10,pool.length)).map(q=>({book:q[0],q:q[1],ok:q[2],opts:shuffle([q[2],...q[3]]),ref:q[4]}));
  tq={book,qs:pick,i:0,score:0,picked:null,ai:!!qs}; renderTrivia();
}
function renderTrivia(){
  state.trivia=state.trivia||{};
  if(gm)return renderGame();
  if(!tq){
    const list=triviaBooks(), withQ=new Set(list.map(x=>x[0]));
    const others=BOOKS.map(b=>b[0]).filter(n=>!withQ.has(n));
    root.innerHTML=hdr("Trivias bíblicas","Pon a prueba lo que sabes")+backBtn()+`
    <h3 class="kbook" style="margin-top:4px">Juegos</h3>
    <div class="hub" style="margin-bottom:10px">${Object.entries(GAMES).map(([k,G])=>{const b=state.trivia["__"+k];return `<button class="hubi" data-game="${k}"><span class="ic">${G.ic}</span><span><b>${G.n}</b><small>${G.d}${b!=null?` · mejor: ${b}/${G.max}`:""}</small></span><span class="muted">›</span></button>`;}).join("")}</div>
    <h3 class="kbook">Preguntas y respuestas</h3>
    <button class="hubi" data-tb="__all"><span class="ic">🎲</span><span><b>Toda la Biblia</b><small>10 preguntas al azar de ${TRIVIA.length}${state.trivia.__all!=null?` · mejor: ${state.trivia.__all}/10`:""}</small></span><span class="muted">›</span></button>
    <h3 class="kbook">Por libro (los 66)</h3>
    <div class="bmap">${list.map(([n,c])=>{const best=state.trivia[n];return `<button class="bm ${best!=null&&best>=10?"done":best!=null?"part":""}" data-tb="${esc(n)}"><b>${esc(n)}</b><small>${best!=null?`Mejor: ${best}/10`:`${c} preguntas`}</small></button>`;}).join("")}</div>
    <h3 class="kbook" style="margin-top:20px">Antiguo y Nuevo Testamento</h3><div class="sub">Cada ronda tiene 10 preguntas al azar del libro. ¡Juega varias veces para verlas todas!</div>`;
    root.querySelectorAll("[data-tb]").forEach(b=>b.onclick=()=>{startTrivia(b.dataset.tb);window.scrollTo(0,0);});
    root.querySelectorAll("[data-game]").forEach(b=>b.onclick=()=>{startGame(b.dataset.game);window.scrollTo(0,0);});
    return;
  }
  const name=tq.book==="__all"?"Toda la Biblia":tq.book;
  if(tq.i>=tq.qs.length){
    const n=tq.qs.length, sc=tq.score, prev=state.trivia[tq.book];
    if(!tq.logged){tq.logged=true;state.triviaLog=(state.triviaLog||[]).concat([new Date().toISOString()]).slice(-300);saveLocal();}
    if(!tq.ai&&(prev==null||sc>prev)){state.trivia[tq.book]=sc;saveLocal();}
    const msg=sc===n?"¡Perfecto! 🏆":sc>=n*0.7?"¡Muy bien! 🎉":sc>=n*0.4?"¡Bien! Sigue leyendo 📖":"¡Ánimo! Es una buena razón para leer este libro 💪";
    root.innerHTML=hdr("Trivias bíblicas",esc(name))+`<div class="card" style="text-align:center"><div style="font-size:3rem;font-family:var(--font-head)">${sc}/${n}</div><h2>${msg}</h2>
      ${!tq.ai&&prev!=null&&sc>prev?`<div class="sub">¡Nuevo récord! Antes: ${prev}/${n}</div>`:""}</div>
      <button class="btn block" id="tagain">🔁 Jugar otra vez</button><button class="btn ghost block" id="tlist" style="margin-top:10px">Elegir otro libro</button>`;
    $("#tagain").onclick=()=>{startTrivia(tq.book);};
    $("#tlist").onclick=()=>{tq=null;renderTrivia();};
    return;
  }
  const q=tq.qs[tq.i], P=tq.picked;
  root.innerHTML=hdr("Trivias bíblicas",esc(name))+`
  <div class="row" style="justify-content:space-between;margin-bottom:8px"><button class="btn ghost sm" id="tquit">‹ Salir</button><span class="badge">Pregunta ${tq.i+1} de ${tq.qs.length} · ${tq.score} ✓</span></div>
  <div class="progress"><i style="width:${tq.i/tq.qs.length*100}%"></i></div>
  <div class="card" style="margin-top:12px">${tq.book==="__all"?`<div class="sub">${esc(q.book)}</div>`:""}<h2 style="margin:4px 0 14px">${esc(q.q)}</h2>
    <div class="tops">${q.opts.map((o,i)=>`<button class="topt ${P!=null?(o===q.ok?"ok":i===P?"bad":""):""}" data-o="${i}" ${P!=null?"disabled":""}>${esc(o)}</button>`).join("")}</div>
    ${P!=null?`<div class="tfb ${q.opts[P]===q.ok?"ok":"bad"}">${q.opts[P]===q.ok?"✅ ¡Correcto!":`❌ La respuesta es: <b>${esc(q.ok)}</b>`}<div class="sub">📖 ${esc(q.ref)}</div></div>
    <button class="btn block" id="tnext" style="margin-top:12px">${tq.i+1<tq.qs.length?"Siguiente ›":"Ver resultado"}</button>`:""}</div>`;
  root.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{if(tq.picked!=null)return;tq.picked=+b.dataset.o;if(q.opts[tq.picked]===q.ok)tq.score++;renderTrivia();});
  if($("#tnext"))$("#tnext").onclick=()=>{tq.i++;tq.picked=null;renderTrivia();window.scrollTo(0,0);};
  $("#tquit").onclick=()=>{tq=null;renderTrivia();};
}

function memoAll(){
  const keys=allKeyVerses().map(x=>({ref:x.ref,body:x.body,src:"clave"}));
  const own=(state.memoCustom||[]).map(x=>({ref:x.ref,body:x.body,src:x.src||"propio",id:x.id}));
  const seen=new Set();return own.concat(keys).filter(x=>{const k=x.ref+"|"+x.body;if(seen.has(k))return false;seen.add(k);return true;});
}

function pickRandomRef(){const have=new Set((state.memoCustom||[]).map(x=>x.ref));const pool=VERSOS_AZAR.filter(r=>!have.has(r));const L=pool.length?pool:VERSOS_AZAR;return L[Math.floor(Math.random()*L.length)];}

let gm=null;
const GAMES={
  quien:{n:"¿Quién lo dijo?",ic:"🗣️",d:"Adivina quién dijo la frase",max:10},
  vf:{n:"¿Verdadero o falso?",ic:"✅",d:"Afirmaciones rápidas",max:10},
  orden:{n:"Ordena la historia",ic:"🔢",d:"Pon los eventos en orden",max:5},
  soy:{n:"¿Quién soy?",ic:"🕵️",d:"Adivina el personaje con pistas",max:32}
};
function startGame(type){
  let items;
  if(type==="quien")items=shuffle(QUIEN_DIJO).slice(0,10).map(x=>({q:x[0],ok:x[1],opts:shuffle([x[1],...x[2]]),ref:x[3]}));
  if(type==="vf")items=shuffle(VF).slice(0,10).map(x=>({q:x[0],ok:x[1],exp:x[2],ref:x[3]}));
  if(type==="orden")items=shuffle(ORDENA).slice(0,5).map(x=>({t:x[0],ok:x[1],mix:shuffle(x[1]),ref:x[2],pick:[]}));
  if(type==="soy"){const names=QUIEN_SOY.map(x=>x[0]);items=shuffle(QUIEN_SOY).slice(0,8).map(x=>({ok:x[0],clues:x[1],ref:x[2],opts:shuffle([x[0],...shuffle(names.filter(n=>n!==x[0])).slice(0,3)]),shown:1,wrong:[]}));}
  gm={type,items,i:0,score:0,done:false}; renderGame();
}
function gameHeader(){const G=GAMES[gm.type];return hdr("Trivias bíblicas",G.ic+" "+G.n)+`<div class="row" style="justify-content:space-between;margin-bottom:8px"><button class="btn ghost sm" id="gquit">‹ Salir</button><span class="badge">${gm.type==="orden"?"Historia":gm.type==="soy"?"Personaje":"Pregunta"} ${Math.min(gm.i+1,gm.items.length)} de ${gm.items.length} · ${gm.score} pts</span></div><div class="progress"><i style="width:${gm.i/gm.items.length*100}%"></i></div>`;}
function gameEnd(){
  const G=GAMES[gm.type], key="__"+gm.type, prev=state.trivia[key];
  if(!gm.logged){gm.logged=true;state.triviaLog=(state.triviaLog||[]).concat([new Date().toISOString()]).slice(-300);}
  if(prev==null||gm.score>prev){state.trivia[key]=gm.score;}
  saveLocal();
  const p=gm.score/G.max, msg=p===1?"¡Perfecto! 🏆":p>=0.7?"¡Muy bien! 🎉":p>=0.4?"¡Bien! Sigue aprendiendo 📖":"¡Ánimo! Inténtalo otra vez 💪";
  root.innerHTML=hdr("Trivias bíblicas",G.ic+" "+G.n)+`<div class="card" style="text-align:center"><div style="font-size:3rem;font-family:var(--font-head)">${gm.score}/${G.max}</div><h2>${msg}</h2>${prev!=null&&gm.score>prev?`<div class="sub">¡Nuevo récord! Antes: ${prev}/${G.max}</div>`:""}</div>
  <button class="btn block" id="gagain">🔁 Jugar otra vez</button><button class="btn ghost block" id="glist" style="margin-top:10px">Elegir otro juego</button>`;
  $("#gagain").onclick=()=>startGame(gm.type); $("#glist").onclick=()=>{gm=null;tq=null;renderTrivia();};
}
function nextBtn(){return `<button class="btn block" id="gnext" style="margin-top:12px">${gm.i+1<gm.items.length?"Siguiente ›":"Ver resultado"}</button>`;}
function renderGame(){
  state.trivia=state.trivia||{};
  if(gm.i>=gm.items.length)return gameEnd();
  const it=gm.items[gm.i];
  let body="";
  if(gm.type==="quien"){
    const P=it.picked;
    body=`<div class="card" style="margin-top:12px"><div class="sub">¿Quién dijo…?</div><h2 style="margin:6px 0 14px;font-family:var(--font-head)">${esc(it.q)}</h2>
      <div class="tops">${it.opts.map((o,i)=>`<button class="topt ${P!=null?(o===it.ok?"ok":i===P?"bad":""):""}" data-o="${i}" ${P!=null?"disabled":""}>${esc(o)}</button>`).join("")}</div>
      ${P!=null?`<div class="tfb ${it.opts[P]===it.ok?"ok":"bad"}">${it.opts[P]===it.ok?"✅ ¡Correcto!":`❌ Lo dijo: <b>${esc(it.ok)}</b>`}<div class="sub">📖 ${esc(it.ref)}</div></div>${nextBtn()}`:""}</div>`;
  }
  if(gm.type==="vf"){
    const P=it.picked;
    body=`<div class="card" style="margin-top:12px"><h2 style="margin:4px 0 14px">${esc(it.q)}</h2>
      <div class="row" style="gap:10px">${[["true","✅ Verdadero"],["false","❌ Falso"]].map(([v,l])=>{const val=v==="true";return `<button class="topt ${P!=null?(val===it.ok?"ok":val===P?"bad":""):""}" style="flex:1;text-align:center" data-vf="${v}" ${P!=null?"disabled":""}>${l}</button>`;}).join("")}</div>
      ${P!=null?`<div class="tfb ${P===it.ok?"ok":"bad"}">${P===it.ok?"✅ ¡Correcto!":`❌ Es <b>${it.ok?"verdadero":"falso"}</b>.`} <span style="color:var(--ink)">${esc(it.exp)}</span><div class="sub">📖 ${esc(it.ref)}</div></div>${nextBtn()}`:""}</div>`;
  }
  if(gm.type==="orden"){
    const checked=it.checked;
    body=`<div class="card" style="margin-top:12px"><h2 style="margin:0 0 6px">${esc(it.t)}</h2><div class="sub" style="margin-bottom:10px">${checked?"":"Toca los eventos en el orden en que pasaron. Toca uno de tu lista para quitarlo."}</div>
      <div class="olist">${it.ok.map((_,k)=>{const e=it.pick[k];const st=checked?(e===it.ok[k]?"ok":"bad"):"";return `<div class="oslot ${e?"fill":""} ${st}" ${e&&!checked?`data-un="${k}"`:""}><span class="on">${k+1}</span>${e?esc(e):"<span class='muted'>…</span>"}${checked&&e!==it.ok[k]?`<div class="sub">Correcto: ${esc(it.ok[k])}</div>`:""}</div>`;}).join("")}</div>
      ${checked?"":`<div class="tops" style="margin-top:12px">${it.mix.filter(e=>!it.pick.includes(e)).map(e=>`<button class="topt" data-ev="${esc(e)}">${esc(e)}</button>`).join("")}</div>`}
      ${!checked&&it.pick.length===it.ok.length?`<button class="btn block" id="ocheck" style="margin-top:12px">Comprobar</button>`:""}
      ${checked?`<div class="tfb ${it.win?"ok":"bad"}">${it.win?"✅ ¡Todo en orden!":"❌ Casi. Revisa el orden correcto."}<div class="sub">📖 ${esc(it.ref)}</div></div>${nextBtn()}`:""}</div>`;
  }
  if(gm.type==="soy"){
    const fin=it.result!=null;
    body=`<div class="card" style="margin-top:12px"><div class="sub">¿Quién soy? · vale ${Math.max(0,5-it.shown-it.wrong.length)} pts</div>
      <ol class="clues">${it.clues.slice(0,fin?it.clues.length:it.shown).map(c=>`<li>${esc(c)}</li>`).join("")}</ol>
      <div class="tops">${it.opts.map(o=>`<button class="topt ${fin?(o===it.ok?"ok":it.wrong.includes(o)?"bad":""):it.wrong.includes(o)?"bad":""}" data-soy="${esc(o)}" ${fin||it.wrong.includes(o)?"disabled":""}>${esc(o)}</button>`).join("")}</div>
      ${!fin&&it.shown<it.clues.length?`<button class="btn soft block" id="sclue" style="margin-top:10px">💡 Otra pista (−1 punto)</button>`:""}
      ${fin?`<div class="tfb ${it.result>0?"ok":"bad"}">${it.result>0?`✅ ¡Soy ${esc(it.ok)}! +${it.result} pts`:`Era <b>${esc(it.ok)}</b>.`}<div class="sub">📖 ${esc(it.ref)}</div></div>${nextBtn()}`:""}</div>`;
  }
  root.innerHTML=gameHeader()+body;
  $("#gquit").onclick=()=>{gm=null;renderTrivia();};
  if($("#gnext"))$("#gnext").onclick=()=>{gm.i++;renderGame();window.scrollTo(0,0);};
  root.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{if(it.picked!=null)return;it.picked=+b.dataset.o;if(it.opts[it.picked]===it.ok)gm.score++;renderGame();});
  root.querySelectorAll("[data-vf]").forEach(b=>b.onclick=()=>{if(it.picked!=null)return;it.picked=b.dataset.vf==="true";if(it.picked===it.ok)gm.score++;renderGame();});
  root.querySelectorAll("[data-ev]").forEach(b=>b.onclick=()=>{it.pick.push(b.dataset.ev);renderGame();});
  root.querySelectorAll("[data-un]").forEach(b=>b.onclick=()=>{it.pick.splice(+b.dataset.un,1);renderGame();});
  if($("#ocheck"))$("#ocheck").onclick=()=>{it.checked=true;it.win=it.pick.every((e,k)=>e===it.ok[k]);if(it.win)gm.score++;renderGame();};
  if($("#sclue"))$("#sclue").onclick=()=>{it.shown++;renderGame();};
  root.querySelectorAll("[data-soy]").forEach(b=>b.onclick=()=>{const o=b.dataset.soy;
    if(o===it.ok){it.result=Math.max(1,5-it.shown-it.wrong.length);gm.score+=it.result;}
    else{it.wrong.push(o);if(it.shown<it.clues.length)it.shown++;if(it.wrong.length>=3){it.result=0;}}
    renderGame();});
}
/* Memorizar */
function seededHide(words,level,seed){
  const idx=words.map((w,i)=>i).filter(i=>/[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]/.test(words[i]));
  const frac=[0,.25,.5,.75,1][level]||0; const n=Math.round(idx.length*frac);
  let h=0;for(const ch of seed)h=(h*31+ch.charCodeAt(0))>>>0;
  const order=idx.map(i=>{h=(h*1103515245+12345)>>>0;return [h,i];}).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
  return new Set(order.slice(0,n));
}
function renderMemo(){
  if(memoForm)return renderMemoForm();
  const all=memoAll(); state.memorizados=state.memorizados||{};
  if(memoKey!==null){
    const x=all.find(y=>y.ref+"|"+y.body===memoKey); if(!x){memoKey=null;return renderMemo();}
    const words=x.body.split(/(\s+)/); const hide=seededHide(words,memoLevel,x.ref);
    const done=!!state.memorizados[x.ref];
    root.innerHTML=hdr("Memorizar",esc(x.ref))+`<button class="btn ghost" id="mback" style="margin-bottom:12px">‹ Versículos</button>
    <div class="card"><div class="sub" style="margin-bottom:8px">Nivel ${memoLevel} de 4 · toca una línea para ver la palabra</div>
      <div class="memo">${words.map((w,i)=>hide.has(i)?`<span class="blank" data-w="${esc(w)}">${"_".repeat(Math.max(3,Math.min(10,w.length)))}</span>`:esc(w)).join("")}</div>
      <div class="sub" style="margin-top:10px"><b>${esc(x.ref)}</b></div></div>
    <div class="row" style="gap:8px;margin-bottom:10px">
      <button class="btn ghost" id="easier" style="flex:1" ${memoLevel<=0?"disabled":""}>− Más fácil</button>
      <button class="btn" id="harder" style="flex:1" ${memoLevel>=4?"disabled":""}>Más difícil +</button></div>
    <button class="btn soft block" id="showall">👁️ Mostrar todo</button>
    <button class="btn block" id="gotit" style="margin-top:10px">${done?"✓ Memorizado (tocar para quitar)":"✓ ¡Ya me lo sé!"}</button>
    ${x.id?`<button class="btn danger block" id="mdel" style="margin-top:10px">Quitar de mi lista</button>`:""}`;
    root.querySelectorAll(".blank").forEach(b=>b.onclick=()=>{b.textContent=b.dataset.w;b.classList.add("shown");});
    $("#mback").onclick=()=>{memoKey=null;renderMemo();};
    $("#easier").onclick=()=>{memoLevel=Math.max(0,memoLevel-1);renderMemo();};
    $("#harder").onclick=()=>{memoLevel=Math.min(4,memoLevel+1);renderMemo();};
    $("#showall").onclick=()=>root.querySelectorAll(".blank").forEach(b=>{b.textContent=b.dataset.w;b.classList.add("shown");});
    if($("#mdel"))$("#mdel").onclick=async()=>{if(!(await ask("¿Quitar versículo?","Se quitará de tu lista de memorizar.","Quitar",true)))return;state.memoCustom=(state.memoCustom||[]).filter(y=>y.id!==x.id);delete state.memorizados[x.ref];memoKey=null;renderMemo();persist("Versículo quitado");};
    $("#gotit").onclick=()=>{if(done)delete state.memorizados[x.ref];else state.memorizados[x.ref]=new Date().toISOString();renderMemo();persist(done?"":"¡Gloria a Dios! Versículo memorizado 🧠");};

function renderSemana(){

  const col=k=>E.map(e=>[e,(e.fields[k]||"").trim()]).filter(x=>x[1]);
  const kv=allKeyVerses().filter(x=>inW(x.entry.date));
  const gr=(state.gratitud||[]).filter(x=>inW(x.date+"T12:00:00")).flatMap(x=>x.items.filter(Boolean));
  const ans=(state.peticiones||[]).filter(x=>x.contestada&&inW(x.fechaContestada));
  const lastDay=new Date(end);lastDay.setDate(lastDay.getDate()-1);

  <div class="card"><div class="stat"><div><b>${E.length}</b><span>devocionales</span></div><div><b>${kv.length}</b><span>versículos clave</span></div><div><b>${ans.length}</b><span>oraciones contestadas</span></div></div>
  ${E.length?`<div class="sub" style="margin-top:10px">Leíste: ${E.map(e=>esc(e.ref)).join(" · ")}</div>`:""}</div>
  ${E.length||gr.length||ans.length?`
  ${kv.length?`<div class="card"><h2>⭐ Versículos clave</h2>${kv.map(x=>`<div class="wk"><div class="pre" style="font-family:var(--font-head)">“${esc(x.body)}”</div><div class="meta">${esc(x.ref)}</div></div>`).join("")}</div>`:""}
  ${block("💬 Mensaje de Dios",col("mensaje"))}${block("📌 Mandatos",col("mandato"))}${block("🎁 Promesas",col("promesa"))}${block("✋ Aplicaciones",col("aplicacion"))}
  ${gr.length?`<div class="card"><h2>🙌 Gratitud</h2>${gr.map(t=>`<div>🙌 ${esc(t)}</div>`).join("")}</div>`:""}
  ${ans.length?`<div class="card"><h2>🙏 Oraciones contestadas</h2>${ans.map(x=>`<div class="wk"><div>✅ ${esc(x.texto)}</div>${x.nota?`<div class="meta">${esc(x.nota)}</div>`:""}</div>`).join("")}</div>`:""}
  <button class="btn soft block" id="wcopy">Copiar resumen</button>`:`<div class="card muted">No hay devocionales en esta semana.</div>`}`;
  $("#wprev").onclick=()=>{weekOffset--;renderSemana();};
  $("#wnext").onclick=()=>{if(weekOffset<0){weekOffset++;renderSemana();}};
  if($("#wcopy"))$("#wcopy").onclick=async()=>{
    const L=[`Resumen de la semana (${f(start)} – ${f(lastDay)})`,"",`Leí: ${E.map(e=>e.ref).join(", ")||"—"}`];
    if(kv.length){L.push("","⭐ VERSÍCULOS CLAVE");kv.forEach(x=>L.push(`“${x.body}” (${x.ref})`));}
    [["mensaje","💬 MENSAJE DE DIOS"],["mandato","📌 MANDATOS"],["promesa","🎁 PROMESAS"],["aplicacion","✋ APLICACIONES"]].forEach(([k,t])=>{const c=col(k);if(c.length){L.push("",t);c.forEach(([e,tx])=>L.push(`• ${tx} (${e.ref})`));}});
    if(gr.length){L.push("","🙌 GRATITUD");gr.forEach(t=>L.push("• "+t));}
    if(ans.length){L.push("","🙏 ORACIONES CONTESTADAS");ans.forEach(x=>L.push("• "+x.texto+(x.nota?" — "+x.nota:"")));}
    try{await navigator.clipboard.writeText(L.join("\n"));toast("Resumen copiado");}catch(_){toast("No se pudo copiar");}};
}

/* ---------- Respaldo ---------- */
/* Formato 2: JSON comprimido (gzip) en base64. No tiene comillas ni símbolos que WhatsApp
   o las apps de notas puedan cambiar, y es mucho más corto. Se siguen aceptando respaldos del formato 1. */
function b64FromBytes(u8){let s="";for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s);}
function bytesFromB64(b){const s=atob(b);const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}
async function backupText(){
  const data=JSON.parse(JSON.stringify(state)); delete data.savedAt;
  const json=JSON.stringify(data);const raw=new TextEncoder().encode(json);
  try{if(window.CompressionStream){const buf=await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream("gzip"))).arrayBuffer();
    return "MISDEVOCIONALES-RESPALDO-2Z\n"+b64FromBytes(new Uint8Array(buf))+"\nFIN";}}catch(_){}
  return "MISDEVOCIONALES-RESPALDO-2B\n"+b64FromBytes(raw)+"\nFIN";
}
function backupCheck(d){if(!d||typeof d!=="object"||!Array.isArray(d.entries))throw new Error("formato");return d;}
async function parseBackup(t){
  t=String(t||"").replace(/\u200b|\ufeff/g,"").trim();
  const m=t.match(/MISDEVOCIONALES-RESPALDO-2([ZB])/);
  if(m){
    let body=t.slice(m.index+m[0].length);const fin=body.search(/FIN/);
    if(fin<0)throw new Error("incompleto");
    body=body.slice(0,fin).replace(/[^A-Za-z0-9+/=]/g,"");
    let bytes;try{bytes=bytesFromB64(body);}catch(_){throw new Error("dañado");}
    if(m[1]==="Z"){if(!window.DecompressionStream)throw new Error("navegador");
      try{const buf=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer();bytes=new Uint8Array(buf);}catch(_){throw new Error("dañado");}}
    return backupCheck(JSON.parse(new TextDecoder().decode(bytes)));
  }
  // Formato 1 (texto JSON)
  const i=t.indexOf("{"); if(i<0)throw new Error("sin datos");
  if(!/MISDEVOCIONALES-RESPALDO/.test(t.slice(0,i)))throw new Error("no es respaldo");
  const j=t.lastIndexOf("}"); if(j<i)throw new Error("incompleto");
  let js=t.slice(i,j+1);
  try{return backupCheck(JSON.parse(js));}catch(_){}
  // Arreglo: algunas apps cambian las comillas " por “ ” o «»; se corrigen solo donde forman parte de la estructura
  js=js.replace(/([{\[,:]\s*)[“”„«»]/g,'$1"').replace(/[“”„«»](\s*[:,}\]])/g,'"$1');
  try{return backupCheck(JSON.parse(js));}catch(e){throw new Error(/end of|Unterminated|Unexpected end/i.test(String(e.message))?"incompleto":"dañado");}
}
function renderBackupCard(){
  const n=state.entries.length, p=(state.peticiones||[]).length;
  return `<div class="card"><h2>💾 Respaldo</h2>
    <div class="sub" style="margin-bottom:10px">Tu avance está guardado solo en este navegador. Haz un respaldo de vez en cuando y guárdalo en WhatsApp o en tus notas. Si cambias de celular, pégalo en «Restaurar».</div>
    <div class="sub" style="margin-bottom:10px">Incluye ${n} devocional${n===1?"":"es"}, ${p} petici${p===1?"ón":"ones"}, notas, versículos, gratitud, ayunos, trivias y ajustes.</div>
    <button class="btn block" id="bkcopy">📋 Copiar respaldo</button>
    <button class="btn ghost block" id="bkrest" style="margin-top:10px">♻️ Restaurar un respaldo</button>
  </div>`;
}
function bindBackup(){
  $("#bkcopy").onclick=async()=>{const t=await backupText();
    try{await navigator.clipboard.writeText(t);toast("Respaldo copiado. Pégalo en WhatsApp o en tus notas.");}
    catch(_){const m=document.createElement("div");m.className="modal";m.innerHTML=`<div class="box wide"><h2>Copia tu respaldo</h2><p>Mantén presionado el texto, elige «Seleccionar todo» y luego «Copiar».</p><textarea rows="8" readonly style="font-size:.75rem">${esc(t)}</textarea><div class="btns" style="margin-top:12px"><button class="btn" data-r="1">Listo</button></div></div>`;m.addEventListener("click",e=>{if(e.target.getAttribute("data-r")||e.target===m)m.remove();});document.body.appendChild(m);}
  };
  $("#bkrest").onclick=()=>{const m=document.createElement("div");m.className="modal";
    m.innerHTML=`<div class="box wide"><h2>♻️ Restaurar respaldo</h2><p>Pega aquí el texto completo del respaldo. Lo que tienes ahora en este navegador será reemplazado.</p><textarea id="bkin" rows="7" placeholder="MISDEVOCIONALES-RESPALDO-1…" style="font-size:.8rem"></textarea><label class="btn ghost sm" style="margin-top:8px;display:inline-block;cursor:pointer">📂 Cargar desde un archivo<input type="file" id="bkfile" accept=".txt,text/plain" style="display:none"></label><div id="bkmsg" class="sub" style="margin-top:6px"></div>
    <div class="btns" style="margin-top:12px"><button class="btn ghost" data-r="0">Cancelar</button><button class="btn" data-r="ok">Restaurar</button></div></div>`;
    m.addEventListener("click",e=>{const r=e.target.getAttribute("data-r");if(e.target===m||r==="0"){m.remove();return;}
      if(r==="ok"){(async()=>{let d;const msg=m.querySelector("#bkmsg");msg.textContent="Revisando…";
        try{d=await parseBackup(m.querySelector("#bkin").value);}catch(err){const k=String(err&&err.message);
          msg.textContent=k==="incompleto"?"❌ El respaldo está incompleto: parece que se cortó al copiarlo o pegarlo. Cópialo de nuevo completo (desde la primera línea hasta la palabra FIN).":
            k==="no es respaldo"||k==="sin datos"?"❌ Ese texto no es un respaldo de Mis Devocionales. Debe empezar con MISDEVOCIONALES-RESPALDO.":
            k==="navegador"?"❌ Este navegador es muy antiguo para abrir este respaldo. Actualiza Chrome o la app.":

function bestStreak(){
  const days=[...new Set(state.entries.map(e=>dkey(e.date)))].sort(); let best=0,cur=0,prev=null;
  days.forEach(d=>{const t=new Date(d+"T12:00:00");if(prev&&Math.round((t-prev)/864e5)===1)cur++;else cur=1;best=Math.max(best,cur);prev=t;});
  return best;
}

const RETOS=[
 ["📖","Haz 5 devocionales esta semana",(s,e,inW)=>state.entries.filter(x=>inW(x.date)).length,5],

function weekChallenges(){
  const [s,e]=weekRange(); const inW=d=>{const x=new Date(d);return x>=s&&x<e;};
  const wk=Math.floor(s.getTime()/(7*864e5)); const idx=[]; let k=wk;
  while(idx.length<3){const i=((k*7919)%RETOS.length+RETOS.length)%RETOS.length;if(!idx.includes(i)&&!(idx.includes(0)&&i===1)&&!(idx.includes(1)&&i===0))idx.push(i);k++;}
  return idx.map(i=>{const r=RETOS[i];const v=r[2](s,e,inW);return {ic:r[0],t:r[1],v:Math.min(v,r[3]),max:r[3]};});
}
function renderRetos(){
  const R=weekChallenges(), [s,e]=weekRange(), last=new Date(e);last.setDate(last.getDate()-1);
  const f=d=>d.toLocaleDateString("es-MX",{day:"numeric",month:"short"}), done=R.filter(r=>r.v>=r.max).length;
  root.innerHTML=hdr("Retos de la semana",`${f(s)} – ${f(last)}`)+backBtn()+`
  <div class="card" style="text-align:center"><div style="font-size:2.4rem">${done===3?"🏆":"🎯"}</div><h2>${done} de 3 retos cumplidos</h2><div class="sub">Cada domingo hay retos nuevos.</div></div>
  ${R.map(r=>`<div class="card"><div class="row" style="align-items:center;gap:12px"><div style="font-size:1.8rem">${r.v>=r.max?"✅":r.ic}</div><div style="flex:1"><b>${esc(r.t)}</b><div class="progress" style="margin-top:6px"><i style="width:${r.v/r.max*100}%"></i></div><div class="sub">${r.v} de ${r.max}</div></div></div></div>`).join("")}`;
}

/* ---------- Buscador de citas ---------- */
function parseRefQ(q){
  const t=norm(q).replace(/\s+/g," ").trim();
  const m=t.match(/^((?:[1-3]\s?)?[a-zñ]+(?:\s(?:de|de los)\s[a-z]+)?)\.?\s*(\d+)(?:\s*[:.,]\s*(\d+)(?:\s*[-–]\s*(\d+))?)?$/);
  if(!m)return null;
  const name=m[1].replace(/^([1-3])\s?/,"$1 ");
  const bi=BOOKS.findIndex(b=>{const n=norm(b[0]);return n===name||(name.length>=3&&n.startsWith(name));});
  if(bi<0)return null;

function buscLocal(q){
  const nq=norm(q).trim();if(nq.length<3)return [];
  const out=[],seen=new Set();
  const add=(ref,body,src)=>{const k=norm(ref+"|"+body);if(seen.has(k))return;seen.add(k);out.push({ref,body,src});};
  state.entries.forEach(e=>{
    const txt=String((e.fields&&e.fields.pasaje)||"");if(!txt.trim())return;
    const bm=BOOKS.find(b=>e.ref.startsWith(b[0]+" "));const cm=e.ref.slice(bm?bm[0].length:0).match(/(\d+)/);
    const book=bm?bm[0]:"",ch=cm?+cm[1]:0;let cur=null,first=true;const vs=[];
    txt.split("\n").forEach(ln=>{const s=ln.trim();if(!s)return;const m=s.match(/^(\d+)\s+(.*)$/);
      if(m){let v=+m[1];first=false;cur={v,t:m[2]};vs.push(cur);}
      else if(cur&&/[.,;:»”"]$/.test(cur.t)===false)cur.t+=" "+s;
      else if(first){first=false;cur={v:1,t:s};vs.push(cur);}});
    vs.forEach(x=>{if(norm(x.t).includes(nq))add(book?`${book} ${ch}:${x.v}`:e.ref,x.t,"Texto que pegaste");});
  });
  allKeyVerses().forEach(x=>{if(norm(x.body).includes(nq))add(x.ref,x.body,"Versículo clave");});
  (state.memoCustom||[]).forEach(x=>{if(norm(x.body).includes(nq))add(x.ref,x.body,"Memorizar");});

function hiliteQ(text,q){

}

cesitas sabiduría?", "¿Qué proverbio puedes aplicar esta semana?"]], ["Salomón (según la tradición)", "c. 935 a.C.", "El sentido de la vida", "El Predicador busca sentido en el placer, el trabajo y la sabiduría, y concluye que sin Dios todo es vanidad.", ["1–2 Todo es vanidad", "3–10 Los tiempos y los límites de la vida", "11–12 Acuérdate de Dios desde la juventud"], ["Eclesiastés 3:1", "Eclesiastés 12:13"], "Jesús da vida en abundancia y llena el vacío que describe Eclesiastés (Juan 10:10).", ["¿Dónde buscas sentido fuera de Dios?", "¿Qué significa para ti hoy que «todo tiene su tiempo»?"]], ["Salomón", "c. 950 a.C.", "El amor", "Poema de amor entre un esposo y su esposa que celebra el amor y el matrimonio como regalo de Dios.", ["1–3 El noviazgo", "3–5 La boda", "5–8 Un amor que madura"], ["Cantares 8:6-7", "Cantares 2:4"], "El amor fiel del esposo refleja el amor de Cristo por su iglesia (Efesios 5:25).", ["¿Qué enseña este libro sobre el valor del amor?", "¿Cómo puede tu amor reflejar el de Cristo?"]], ["Isaías", "c. 700 a.C.", "La salvación del Señor", "Isaías anuncia juicio por el pecado, pero también consuelo y un Siervo que sufriría para salvar a su pueblo.", ["1–39 Juicio y esperanza", "40–55 Consuelo y el Siervo del Señor", "56–66 La gloria futura"], ["Isaías 9:6", "Isaías 53:5"], "Profetiza el nacimiento virginal (7:14) y la muerte de Jesús por nuestros pecados (cap. 53).", ["¿Qué te enseña Isaías 53 sobre la cruz?", "¿Cómo renueva Dios tus fuerzas (40:31)?"]], ["Jeremías", "c. 627–580 a.C.", "Arrepentimiento y nuevo pacto", "El «profeta llorón» advierte a Judá durante 40 años; Jerusalén cae, pero Dios promete un nuevo pacto.", ["1–25 Advertencias a Judá", "26–45 La vida de Jeremías y la caída de Jerusalén", "46–52 Profecías sobre las naciones"], ["Jeremías 29:11", "Jeremías 31:33"], "Jesús inauguró el nuevo pacto prometido (Lucas 22:20).", ["¿Cómo perseveró Jeremías cuando nadie lo escuchaba?", "¿Qué significa tener la ley de Dios escrita en el corazón?"]], ["Jeremías (según la tradición)", "c. 586 a.C.", "Dolor y esperanza", "Cinco poemas lloran la destrucción de Jerusalén, pero en medio del dolor brilla la fidelidad de Dios.", ["1–2 Jerusalén destruida", "3 Esperanza en la misericordia de Dios", "4–5 Súplica"], ["Lamentaciones 3:22-23", "Lamentaciones 3:25"], "Jesús lloró por Jerusalén (Lucas 19:41) y cargó con nuestro dolor.", ["¿Cómo le expresas tu dolor a Dios?", "¿Qué nuevas misericordias ves cada mañana?"]], ["Ezequiel", "c. 590–570 a.C.", "La gloria de Dios", "Desde el exilio, Ezequiel ve la gloria de Dios, anuncia juicio y promete un corazón nuevo y un templo restaurado.", ["1–24 Juicio sobre Judá", "25–32 Juicio sobre las naciones", "33–48 Restauración y el nuevo templo"], ["Ezequiel 36:26", "Ezequiel 37:5"], "Jesús es el buen pastor que Dios prometió (cap. 34).", ["¿Qué «huesos secos» necesitan vida en tu vida?", "¿Qué significa tener un corazón nuevo?"]], ["Daniel", "c. 530 a.C.", "Dios gobierna sobre los reinos", "Daniel y sus amigos son fieles en Babilonia; Dios les da la victoria y revela el futuro de los reinos del mundo.", ["1–6 Historias de fidelidad", "7–12 Visiones del futuro"], ["Daniel 3:17-18", "Daniel 2:44"], "Daniel ve a «uno como hijo de hombre» recibir el reino (7:13), el título que Jesús usó para sí mismo.", ["¿Cómo ser fiel en un ambiente difícil?", "¿Qué te enseña el horno de fuego sobre la confianza?"]], ["Oseas", "c. 750 a.C.", "El amor fiel de Dios", "Dios le pide a Oseas casarse con una mujer infiel para mostrar su amor por un Israel infiel.", ["1–3 El matrimonio de Oseas", "4–14 La infidelidad de Israel y el amor de Dios"], ["Oseas 6:6", "Oseas 14:4"], "Así como Oseas rescató a su esposa pagando un precio, Jesús nos redimió a un precio muy alto.", ["¿Cómo te ha buscado Dios cuando te alejaste?", "¿Qué prefiere Dios según 6:6?"]], ["Joel", "Fecha incierta", "El día del Señor", "Una plaga de langostas es una advertencia del día del Señor; Dios llama al arrepentimiento y promete derramar su Espíritu.", ["1 La plaga", "2 Llamado al arrepentimiento", "2:28–3 El Espíritu y el juicio"], ["Joel 2:13", "Joel 2:28"], "La promesa del Espíritu se cumplió en Pentecostés (Hechos 2).", ["¿Qué significa rasgar el corazón y no los vestidos?", "¿Cómo obra el Espíritu Santo en ti?"]], ["Amós", "c. 760 a.C.", "Justicia", "Un pastor de Tecoa denuncia la injusticia y la religiosidad vacía de Israel.", ["1–2 Juicio sobre las naciones", "3–6 Mensajes a Israel", "7–9 Visiones y restauración"], ["Amós 5:24", "Amós 4:12"], "Amós promete levantar el tabernáculo caído de David (9:11), cumplido en Jesús (Hechos 15).", ["¿Dónde ves injusticias que Dios rechaza?", "¿Cómo puede tu fe volverse práctica?"]], ["Abdías", "c. 586 a.C.", "Juicio sobre Edom", "El libro más corto del Antiguo Testamento anuncia juicio contra Edom por su orgullo y por dañar a Judá.", ["1–14 El orgullo y el pecado de Edom", "15–21 El día del Señor y su reino"], ["Abdías 1:3", "Abdías 1:15"], "El reino será del Señor (v. 21), y se cumple en Cristo.", ["¿Cómo te engaña el orgullo?", "¿Por qué le importa a Dios cómo tratamos a los demás?"]], ["Jonás", "c. 760 a.C.", "La misericordia de Dios para todos", "Jonás huye de Dios, es tragado por un gran pez, predica en Nínive y se enoja porque Dios perdona.", ["1 La huida", "2 Oración dentro del pez", "3 Nínive se arrepiente", "4 Una lección para Jonás"], ["Jonás 2:9", "Jonás 4:2"], "Jesús habló de «la señal de Jonás»: tres días y luego la resurrección (Mateo 12:40).", ["¿Hacia dónde estás huyendo de Dios?", "¿A quién te cuesta desear que Dios perdone?"]], ["Miqueas", "c. 730 a.C.", "Juicio y esperanza", "Denuncia la injusticia de Israel y Judá, y promete un gobernante que nacería en Belén.", ["1–3 Juicio", "4–5 Esperanza y el rey de Belén", "6–7 Lo que Dios pide"], ["Miqueas 6:8", "Miqueas 5:2"], "Anunció que el Mesías nacería en Belén (5:2).", ["¿Cómo puedes vivir 6:8 esta semana?", "¿Qué te dice 7:18-19 sobre el perdón?"]], ["Nahúm", "c. 650 a.C.", "Juicio sobre Nínive", "Anuncia la caída de Nínive, que volvió a su maldad; Dios es lento para la ira, pero también es justo.", ["1 Dios es bueno y justo", "2–3 La caída de Nínive"], ["Nahúm 1:7", "Nahúm 1:3"], "Jesús es las «buenas nuevas» que anuncian paz (1:15).", ["¿Qué te consuela de que Dios sea fortaleza en el día de la angustia (1:7)?", "¿Por qué Dios no deja el mal sin castigo?"]], ["Habacuc", "c. 605 a.C.", "Vivir por la fe", "El profeta pregunta por qué Dios permite el mal; Dios le responde y Habacuc aprende a confiar.", ["1–2 Preguntas y respuestas", "3 Oración de confianza"], ["Habacuc 2:4", "Habacuc 3:17-18"], "«El justo por su fe vivirá» es la base del evangelio (Romanos 1:17).", ["¿Qué preguntas le harías a Dios?", "¿Puedes alegrarte en Dios aunque te falte todo?"]], ["Sofonías", "c. 630 a.C.", "El día del Señor", "Anuncia juicio sobre Judá y las naciones, y un remanente al que Dios salvará con alegría.", ["1 Juicio sobre Judá", "2 Juicio sobre las naciones", "3 Restauración"], ["Sofonías 3:17", "Sofonías 2:3"], "El Rey que estará en medio de su pueblo (3:15) es Jesús.", ["¿Qué sientes al saber que Dios se alegra por ti (3:17)?", "¿Cómo puedes buscar la humildad?"]], ["Hageo", "520 a.C.", "Reconstruir el templo", "Anima al pueblo a dejar de poner primero sus casas y a terminar el templo de Dios.", ["1 Consideren sus caminos", "2 La gloria del nuevo templo"], ["Hageo 1:5", "Hageo 2:4"], "La gloria de la casa postrera (2:9) se cumplió cuando Jesús entró en el templo.", ["¿Qué está en primer lugar en tu vida?", "¿Qué obra de Dios has dejado a medias?"]], ["Zacarías", "c. 520–480 a.C.", "Esperanza en el Mesías", "Con visiones anima a reconstruir el templo y anuncia la venida de un Rey humilde.", ["1–6 Ocho visiones", "7–8 Ayuno y obediencia", "9–14 El Rey que viene"], ["Zacarías 4:6", "Zacarías 9:9"], "Profetizó la entrada de Jesús en un asno (9:9) y que lo traspasarían (12:10).", ["¿Qué significa «no con ejército, ni con fuerza, sino con mi espíritu»?", "¿Cómo ves a Jesús en Zacarías 9:9?"]], ["Malaquías", "c. 430 a.C.", "Volver a Dios", "El último profeta del Antiguo Testamento confronta la religión fría del pueblo y anuncia un mensajero antes del Señor.", ["1–2 Ofrendas y sacerdotes infieles", "2–3 Matrimonio, justicia y diezmos", "4 El día del Señor y Elías"], ["Malaquías 3:10", "Malaquías 3:6"], "Anuncia a Juan el Bautista (3:1), que preparó el camino para Jesús.", ["¿Le das a Dios lo mejor o lo que sobra?", "¿Qué te enseña que Dios no cambia (3:6)?"]], ["Mateo", "c. 60 d.C.", "Jesús, el Rey prometido", "Escrito sobre todo para judíos, muestra que Jesús es el Mesías prometido, hijo de David, y explica su reino.", ["1–4 Nacimiento y preparación", "5–7 El Sermón del monte", "8–20 Ministerio en Galilea", "21–28 Muerte y resurrección"], ["Mateo 6:33", "Mateo 28:19-20"], "Mateo cita muchas profecías del Antiguo Testamento cumplidas en Jesús.", ["¿Qué enseñanza del Sermón del monte te desafía?", "¿Cómo puedes hacer discípulos?"]], ["Juan Marcos", "c. 55–65 d.C.", "Jesús, el Siervo", "El evangelio más corto y rápido presenta a Jesús en acción: sana, enseña y da su vida.", ["1–8 Ministerio en Galilea", "8–10 Camino a Jerusalén", "11–16 La última semana y la resurrección"], ["Marcos 10:45", "Marcos 1:15"], "Jesús vino a servir y a dar su vida en rescate por muchos (10:45).", ["¿Cómo sirvió Jesús a la gente?", "¿A quién puedes servir esta semana?"]], ["Lucas, el médico", "c. 60 d.C.", "Jesús, el Salvador de todos", "Una investigación ordenada que muestra el amor de Jesús por los pobres, las mujeres, los enfermos y los pecadores.", ["1–4 Nacimiento y preparación", "4–9 Ministerio en Galilea", "9–19 Camino a Jerusalén y parábolas", "19–24 Muerte y resurrección"], ["Lucas 19:10", "Lucas 15:7"], "Jesús vino a buscar y a salvar lo que se había perdido (19:10).", ["¿Con qué personaje de las parábolas de Lucas 15 te identificas?", "¿A quién ves que Jesús busca hoy?"]], ["Juan", "c. 85–90 d.C.", "Jesús, el Hijo de Dios", "Fue escrito para que creamos que Jesús es el Cristo y tengamos vida en su nombre; incluye siete señales y los «Yo soy».", ["1–12 Las siete señales", "13–17 La última cena y sus enseñanzas", "18–21 Muerte y resurrección"], ["Juan 3:16", "Juan 20:31"], "Jesús dice «Yo soy» el pan de vida, la luz del mundo, la puerta, el buen pastor, la resurrección, el camino y la vid verdadera.", ["¿Qué «Yo soy» de Jesús necesitas hoy?", "¿Por qué escribió Juan su evangelio (20:31)?"]], ["Lucas", "c. 62 d.C.", "La iglesia y el Espíritu Santo", "Cuenta cómo el Espíritu Santo impulsó a la iglesia desde Jerusalén hasta Roma.", ["1–7 Jerusalén", "8–12 Judea y Samaria", "13–28 Hasta lo último de la tierra: los viajes de Pablo"], ["Hechos 1:8", "Hechos 2:42"], "Jesús resucitado sigue obrando por medio de su Espíritu en la iglesia.", ["¿Cómo te da poder el Espíritu para hablar de Jesús?", "¿Cuáles de las prácticas de la iglesia de 2:42 vives tú?"]], ["Pablo", "c. 57 d.C.", "El evangelio de la gracia", "Explica que todos pecamos, que somos justificados por la fe en Cristo y cómo vivir esa nueva vida.", ["1–3 Todos pecaron", "3–5 Justificados por la fe", "6–8 Nueva vida en el Espíritu", "9–11 Israel y el plan de Dios", "12–16 Vida práctica"], ["Romanos 3:23-24", "Romanos 8:28"], "Cristo murió por nosotros cuando aún éramos pecadores (5:8).", ["¿Qué significa ser justificado por la fe?", "¿Qué cambia en tu vida saber que nada te separa del amor de Dios (8:38-39)?"]], ["Pablo", "c. 55 d.C.", "Corrección a una iglesia dividida", "Pablo responde a divisiones, inmoralidad, preguntas sobre los dones y dudas sobre la resurrección.", ["1–4 Divisiones", "5–7 Moral y matrimonio", "8–10 Libertad cristiana", "11–14 Adoración y dones", "15–16 La resurrección"], ["1 Corintios 13:4-7", "1 Corintios 15:3-4"], "Cristo crucificado es poder y sabiduría de Dios, y su resurrección es nuestra esperanza.", ["¿Cómo se ve el amor de 1 Corintios 13 en tu casa?", "¿Por qué es tan importante la resurrección?"]], ["Pablo", "c. 56 d.C.", "Fortaleza en la debilidad", "Pablo defiende su ministerio y muestra que el poder de Dios se perfecciona en la debilidad.", ["1–7 El ministerio de la reconciliación", "8–9 La ofrenda generosa", "10–13 Defensa de Pablo"], ["2 Corintios 5:17", "2 Corintios 12:9"], "En Cristo somos nueva creación; él tomó nuestro pecado para darnos su justicia (5:21).", ["¿Qué debilidad tuya puede usar Dios?", "¿Qué significa ser una nueva criatura?"]], ["Pablo", "c. 49 d.C.", "Libertad en Cristo", "Defiende que somos salvos por gracia mediante la fe y no por cumplir la ley, y llama a vivir guiados por el Espíritu.", ["1–2 El evangelio de Pablo", "3–4 La fe, no las obras de la ley", "5–6 Libertad y el fruto del Espíritu"], ["Gálatas 2:20", "Gálatas 5:22-23"], "Cristo nos redimió de la maldición de la ley (3:13).", ["¿Qué fruto del Espíritu necesitas cultivar?", "¿Intentas ganarte el amor de Dios?"]], ["Pablo", "c. 60 d.C.", "La iglesia, cuerpo de Cristo", "Explica las riquezas que tenemos en Cristo y cómo vivir en unidad, en familia y en la batalla espiritual.", ["1–3 Nuestras riquezas en Cristo", "4–6 Una vida digna: unidad, familia y la armadura de Dios"], ["Efesios 2:8-9", "Efesios 6:10-11"], "En Cristo tenemos toda bendición espiritual (1:3).", ["¿Qué pieza de la armadura de Dios necesitas hoy?", "¿Qué significa ser salvo por gracia?"]], ["Pablo", "c. 61 d.C.", "Gozo en Cristo", "Desde la cárcel, Pablo escribe una carta llena de gozo y anima a imitar la humildad de Cristo.", ["1 Gozo en el sufrimiento", "2 La humildad de Cristo", "3 Conocer a Cristo", "4 Paz y contentamiento"], ["Filipenses 4:13", "Filipenses 4:6-7"], "Cristo se humilló hasta la muerte en la cruz y Dios lo exaltó (2:5-11).", ["¿Cómo puedes tener gozo en momentos difíciles?", "¿Qué preocupación puedes convertir hoy en oración?"]], ["Pablo", "c. 60 d.C.", "Cristo es suficiente", "Presenta a Cristo como supremo sobre todas las cosas y advierte contra enseñanzas que quieren añadirle algo.", ["1–2 La supremacía de Cristo", "3–4 La nueva vida en Cristo"], ["Colosenses 1:16-17", "Colosenses 3:23"], "Cristo es la imagen del Dios invisible y en él habita toda la plenitud de Dios (1:15; 2:9).", ["¿Qué buscas aparte de Cristo para sentirte completo?", "¿Cómo puedes trabajar «como para el Señor»?"]], ["Pablo", "c. 51 d.C.", "La venida del Señor", "Pablo anima a una iglesia nueva y perseguida y enseña sobre el regreso de Cristo.", ["1–3 Gratitud por la iglesia", "4–5 Santidad y la venida del Señor"], ["1 Tesalonicenses 5:16-18", "1 Tesalonicenses 4:16-17"], "Jesús volverá y estaremos siempre con él.", ["¿Cómo puedes vivir 5:16-18 cada día?", "¿Qué esperanza te da la venida de Cristo?"]], ["Pablo", "c. 51 d.C.", "Firmes hasta que él venga", "Corrige ideas equivocadas sobre el fin y anima a trabajar y perseverar.", ["1 Ánimo en la persecución", "2 Antes del día del Señor", "3 Trabajar y no desanimarse"], ["2 Tesalonicenses 3:3", "2 Tesalonicenses 3:13"], "Cristo vencerá al mal en su venida (2:8).", ["¿Cómo te guarda el Señor del mal?", "¿Por qué no debemos cansarnos de hacer el bien?"]], ["Pablo", "c. 63 d.C.", "Orden en la iglesia", "Instrucciones a Timoteo sobre la sana doctrina, la oración, los líderes de la iglesia y la vida piadosa.", ["1 La sana doctrina", "2–3 La oración y los líderes", "4–6 Un buen ministro y la piedad"], ["1 Timoteo 4:12", "1 Timoteo 2:5"], "Hay un solo mediador entre Dios y los hombres: Jesucristo (2:5).", ["¿Cómo puedes ser ejemplo aunque seas joven?", "¿Qué dice Pablo sobre el amor al dinero (6:10)?"]], ["Pablo", "c. 67 d.C.", "Fiel hasta el final", "La última carta de Pablo antes de morir anima a Timoteo a ser fiel y a predicar la Palabra.", ["1–2 Sé fuerte en la gracia", "3 Tiempos difíciles y las Escrituras", "4 Predica la Palabra; despedida"], ["2 Timoteo 3:16-17", "2 Timoteo 4:7"], "Jesús, resucitado de entre los muertos, es el centro del evangelio (2:8).", ["¿Para qué sirve la Escritura según 3:16?", "¿Cómo quieres terminar tu carrera?"]], ["Pablo", "c. 63 d.C.", "Las buenas obras", "Instrucciones para organizar las iglesias en Creta y vivir de una manera que adorne el evangelio.", ["1 Los líderes", "2 Enseñanza para cada grupo", "3 Buenas obras"], ["Tito 2:11-12", "Tito 3:5"], "Dios nos salvó por su misericordia, no por nuestras obras (3:5).", ["¿Cómo te enseña la gracia a vivir?", "¿Qué buenas obras puedes hacer esta semana?"]], ["Pablo", "c. 60 d.C.", "Perdón y reconciliación", "Pablo le pide a Filemón que reciba como hermano a Onésimo, su esclavo fugitivo que ahora es cristiano.", ["1–7 Gratitud por Filemón", "8–25 Petición por Onésimo"], ["Filemón 1:16", "Filemón 1:18"], "Como Pablo, Jesús dice «ponlo a mi cuenta» por nuestros pecados.", ["¿A quién necesitas recibir de nuevo?", "¿Cómo cambia el evangelio nuestras relaciones?"]], ["Desconocido", "c. 68 d.C.", "Jesús es mejor", "Muestra que Jesús es superior a los ángeles, a Moisés y al sistema de sacrificios, y llama a perseverar en la fe.", ["1–4 Jesús, mejor que los ángeles y que Moisés", "5–10 Mejor sacerdote y mejor sacrificio", "11–13 La fe y la perseverancia"], ["Hebreos 11:1", "Hebreos 12:1-2"], "Jesús es el gran Sumo Sacerdote que se ofreció una sola vez y para siempre.", ["¿Qué personaje de la fe (cap. 11) te inspira?", "¿Qué peso necesitas dejar (12:1)?"]], ["Santiago, hermano de Jesús", "c. 45–49 d.C.", "La fe en acción", "Una carta práctica: la fe verdadera se demuestra en las pruebas, las palabras, el trato a los pobres y las obras.", ["1 Pruebas y poner en práctica la Palabra", "2 Fe y obras", "3 La lengua", "4–5 Humildad, paciencia y oración"], ["Santiago 1:22", "Santiago 2:17"], "Santiago llama a Jesús «Señor de gloria» (2:1).", ["¿Eres hacedor de la Palabra o solo oidor?", "¿Cómo puedes cuidar tus palabras?"]], ["Pedro", "c. 64 d.C.", "Esperanza en el sufrimiento", "Anima a cristianos que sufren a mantener una esperanza viva y una conducta santa.", ["1–2 Esperanza viva y pueblo santo", "3–4 Sufrir haciendo el bien", "5 Los pastores y la humildad"], ["1 Pedro 5:7", "1 Pedro 2:24"], "Cristo llevó nuestros pecados en su cuerpo sobre la cruz (2:24).", ["¿Qué ansiedad puedes echar sobre Dios hoy?", "¿Cómo responder al sufrimiento como Jesús?"]], ["Pedro", "c. 67 d.C.", "Crecer y estar alerta", "Llama a crecer en la fe, advierte contra los falsos maestros y recuerda que Cristo volverá.", ["1 Crecer en virtudes", "2 Los falsos maestros", "3 La venida del Señor"], ["2 Pedro 3:9", "2 Pedro 1:5-7"], "Pedro fue testigo de la gloria de Cristo en el monte (1:16-18).", ["¿Qué virtud de 1:5-7 te falta?", "¿Por qué Dios es paciente (3:9)?"]], ["Juan", "c. 90 d.C.", "Comunión y amor", "Juan explica cómo saber que tenemos vida eterna: caminar en la luz, amar a los hermanos y creer en Jesús.", ["1–2 Caminar en la luz", "3–4 Amar como Dios ama", "5 La seguridad de la vida eterna"], ["1 Juan 1:9", "1 Juan 4:8"], "Jesús es nuestro abogado ante el Padre (2:1).", ["¿Qué seguridad te da 1 Juan 5:13?", "¿Cómo puedes mostrar amor con hechos (3:18)?"]], ["Juan", "c. 90 d.C.", "Verdad y amor", "Una carta breve que anima a andar en amor y a no recibir a los falsos maestros.", ["1–6 Andar en verdad y en amor", "7–13 Cuidado con los engañadores"], ["2 Juan 1:6", "2 Juan 1:9"], "Confesar que Jesús vino en carne es esencial (v. 7).", ["¿Cómo van juntas la verdad y el amor?", "¿Cómo puedes distinguir una enseñanza falsa?"]], ["Juan", "c. 90 d.C.", "Hospitalidad", "Elogia a Gayo por recibir a los misioneros y corrige al orgulloso Diótrefes.", ["1–8 Gayo, ejemplo de hospitalidad", "9–14 Diótrefes y Demetrio"], ["3 Juan 1:4", "3 Juan 1:11"], "Los misioneros salieron por amor del nombre de Jesús (v. 7).", ["¿Cómo puedes apoyar a quienes sirven a Dios?", "¿A quién imitas en lo bueno?"]], ["Judas, hermano de Jesús", "c. 65 d.C.", "Contender por la fe", "Advierte contra los falsos maestros y anima a mantenerse en el amor de Dios.", ["1–4 Contender por la fe", "5–16 El juicio de los impíos", "17–25 Mantenerse en el amor de Dios"], ["Judas 1:3", "Judas 1:24-25"], "Jesús puede guardarnos sin caída (v. 24).", ["¿Cómo te mantienes en el amor de Dios?", "¿Qué significa contender por la fe?"]], ["Juan", "c. 95 d.C.", "La victoria de Cristo", "Visiones que revelan a Cristo glorioso, el juicio sobre el mal y la nueva creación donde Dios vivirá con su pueblo.", ["1–3 Cartas a las siete iglesias", "4–5 El trono y el Cordero", "6–20 Juicios y victoria", "21–22 Cielo nuevo y tierra nueva"], ["Apocalipsis 21:4", "Apocalipsis 3:20"], "Jesús es el Cordero vencedor, el Alfa y la Omega, que viene pronto.", ["¿Qué te consuela de Apocalipsis 21?", "¿Qué le diría Jesús a tu iglesia, como a las siete iglesias?"]]];

function estData(){if(!state.estudio||typeof state.estudio!=="object")state.estudio={resp:{},done:{}};state.estudio.resp=state.estudio.resp||{};state.estudio.done=state.estudio.done||{};return state.estudio;}
function estRefHtml(ref){
  const r=parseRefQ(ref);if(!r)return "";const b=BOOKS[r.bi];
  const q=`${b[1]} ${r.ch}${r.v?":"+r.v+(r.vEnd?"-"+r.vEnd:""):""}`;
  const t=RV?rvText(r.bi,r.ch,r.v,r.vEnd||r.v):"";
  const body=RV?t.split("\n").map(l=>{const m=l.match(/^(\d+) (.*)$/);return m?`<span style="margin-right:2px"><sup><b>${m[1]}</b></sup> ${esc(m[2])}</span> `:"";}).join(""):`<span class="sub">Cargando el texto…</span>`;
  return `<div class="kv"><div>${body}</div><div class="kr">📖 <b>${esc(ref)}</b> · <button data-orig="${r.bi},${r.ch},${r.v},${r.vEnd||r.v}" style="background:none;border:0;padding:0;color:inherit;text-decoration:underline;font:inherit;cursor:pointer">🔤 original</button> · <a target="_blank" rel="noopener" href="https://www.biblegateway.com/passage/?search=${encodeURIComponent(q)}&version=${encodeURIComponent(bibleVer())}">${esc(bibleVer())} ↗</a></div></div>`;
}
function estQs(prefix,qs){const R=estData().resp;

function bosquejoTexto(tema,ids){
  const E=ids.map(id=>state.entries.find(e=>e.id===id)).filter(Boolean).sort((a,b)=>new Date(a.date)-new Date(b.date));
  const tr=(t,n)=>{t=String(t||"").trim().replace(/\s*\n+\s*/g," ");return t.length>n?t.slice(0,n).replace(/\s+\S*$/,"")+"…":t;};
  const vk=e=>{const v=String(e.fields.versiculo||"").split(/\n{2,}/)[0].trim();return v||e.ref;};
  const L=[];L.push("🎤 "+(tema||"Mensaje").toUpperCase());L.push("");
  const base=E.find(e=>(e.fields.versiculo||"").trim())||E[0];
  L.push("📖 Texto base: "+vk(base));L.push("");
  L.push("INTRODUCCIÓN");L.push("• "+(tr(base.fields.reflexion||base.fields.mensaje,320)||"(Escribe cómo vas a introducir el tema)"));L.push("");
  L.push("PUNTOS");
  E.forEach((e,i)=>{const f=e.fields;L.push(`${i+1}. ${(f.titulo||"").trim()||e.ref}`);L.push("   📖 "+tr(vk(e),260));
    if((f.reflexion||"").trim()&&e!==base)L.push("   • Explicación: "+tr(f.reflexion,260));
    if((f.mensaje||"").trim())L.push("   • Lo que Dios nos dice: "+tr(f.mensaje,220));
    if((f.mandato||"").trim())L.push("   • Mandato: "+tr(f.mandato,180));
    if((f.promesa||"").trim())L.push("   • Promesa: "+tr(f.promesa,180));
    if((f.aplicacion||"").trim())L.push("   • Aplicación: "+tr(f.aplicacion,220));
    L.push("");});
  L.push("CONCLUSIÓN");const pens=E.map(e=>(e.fields.pensamiento||"").trim()).filter(Boolean);
  L.push("• "+(pens.length?tr(pens.join(" "),320):"(Resume la idea principal y lo que la gente debe recordar)"));L.push("");
  L.push("LLAMADO Y ORACIÓN");const orac=[...E].reverse().find(e=>(e.fields.oracion||"").trim());
  L.push("• "+(orac?tr(orac.fields.oracion,320):"(Invita a responder a la Palabra y termina en oración)"));
  return L.join("\n");
}

var RVS=null,rvsP=null,STR=null,strP=null;
function loadJSON(u){return fetch(u).then(r=>{if(!r.ok)throw new Error(u);return r.json();});}
function loadOrig(){
  if(!RVS&&!rvsP)rvsP=loadJSON("rvs.json").then(d=>RVS=d).catch(e=>{rvsP=null;throw e;});
  if(!STR&&!strP)strP=loadJSON("strongs.json").then(d=>STR=d).catch(e=>{strP=null;throw e;});

const ORE=/\{([^|}]*)\|([^}]*)\}/g;
function origVerseHtml(t,P){let out="",last=0,m;ORE.lastIndex=0;
  while((m=ORE.exec(t))){out+=esc(t.slice(last,m.index));out+=`<span class="ow" data-sc="${m[2].split(",").map(n=>P+n).join(",")}">${esc(m[1])}</span>`;last=ORE.lastIndex;}
  return out+esc(t.slice(last));}
function origUses(code){
  const P=code[0],n=code.slice(1),bs=P==="H"?[0,39]:[39,66],tally={},refs=[];let count=0;
  const re=new RegExp("\\{([^|}]*)\\|(?:[^}]*,)?"+n+"(?:,[^}]*)?\\}","g");
  for(let bi=bs[0];bi<bs[1];bi++)RVS[bi].forEach((c,ci)=>c.forEach((t,vi)=>{if(t.indexOf("|")<0)return;re.lastIndex=0;let m,hit=false;
    while((m=re.exec(t))){const w=m[1].trim();if(w){const lw=w.toLowerCase();const k=lw.replace(/^((el|la|los|las|lo|de|del|al|á|a|y|e|en|con|por|para|un|una|es|que|su|sus|mi|mis|tu|tus|se|no|ni|o)\s+)+/,"")||lw;tally[k]=(tally[k]||0)+1;}if(!hit){hit=true;count++;if(refs.length<25)refs.push([bi,ci+1,vi+1,w]);}}}));
  return {count,refs,tally:Object.entries(tally).sort((a,b)=>b[1]-a[1]).slice(0,10)};
}
function showOrig(bi,ch,v1,v2){

  document.body.appendChild(m);

  const ob=m.querySelector("#obody");const P=bi<39?"H":"G";

  const passage=()=>{const C=RVS[bi][ch-1]||[];const a=v1||1,b=Math.min(C.length,v2||(v1?v1:C.length));
    ob.innerHTML=`<h2 style="margin:0 0 4px">🔤 ${esc(ref)}</h2><div class="sub" style="margin-bottom:10px">Toca una palabra subrayada para ver la palabra original en ${P==="H"?"hebreo":"griego"}.</div><div class="bible orig">${C.slice(a-1,b).map((t,i)=>`<div style="margin-bottom:8px"><sup><b>${a+i}</b></sup> ${origVerseHtml(t,P)}</div>`).join("")}</div>`;
    ob.scrollTop=0;m.querySelector(".box").scrollTop=0;};

const PERSONAJES=[["Adán", "🌳", "El primer hombre, creado por Dios del polvo de la tierra.", "Dios lo puso en el huerto del Edén para cuidarlo. Desobedeció comiendo del árbol prohibido y el pecado entró al mundo.", "Nuestras decisiones tienen consecuencias, pero Dios ya tenía un plan de rescate.", ["Génesis 2:7-8", "Génesis 3:6-9"]], ["Eva", "🍎", "La primera mujer, compañera de Adán.", "Fue engañada por la serpiente y comió del fruto prohibido. Aun así, Dios le prometió que de su descendencia vendría quien venciera al mal.", "La tentación empieza dudando de lo que Dios dijo.", ["Génesis 2:21-23", "Génesis 3:1-6", "Génesis 3:15"]], ["Noé", "🚢", "Un hombre justo en una generación corrompida.", "Obedeció a Dios construyendo el arca durante años. Dios lo salvó a él, a su familia y a los animales del diluvio.", "Obedecer a Dios aunque nadie más lo haga.", ["Génesis 6:9", "Génesis 6:22", "Génesis 9:13"]], ["Abraham", "⭐", "El padre de la fe y del pueblo de Israel.", "Dejó su tierra por obedecer a Dios, esperó muchos años al hijo prometido y estuvo dispuesto a entregarlo.", "La fe confía en las promesas de Dios aunque tarden.", ["Génesis 12:1-3", "Génesis 15:6", "Hebreos 11:8"]], ["Sara", "👵", "Esposa de Abraham y madre de Isaac.", "Se rió al oír que tendría un hijo siendo anciana, pero Dios cumplió su promesa y nació Isaac.", "Para Dios no hay nada imposible.", ["Génesis 18:12-14", "Génesis 21:1-2", "Hebreos 11:11"]], ["Isaac", "🐑", "El hijo de la promesa, hijo de Abraham y Sara.", "Fue llevado al monte Moriah, donde Dios proveyó un carnero en su lugar. Se casó con Rebeca y fue padre de Esaú y Jacob.", "Dios provee en el momento justo.", ["Génesis 22:7-8", "Génesis 24:67"]], ["Rebeca", "💧", "Esposa de Isaac y madre de Esaú y Jacob.", "Mostró bondad dando agua al siervo de Abraham y a sus camellos, y así Dios la escogió como esposa de Isaac.", "La bondad en lo pequeño abre puertas grandes.", ["Génesis 24:15-20", "Génesis 25:21-23"]], ["Jacob", "🪜", "Nieto de Abraham, padre de las doce tribus de Israel.", "Engañó a su hermano y a su padre, pero Dios lo encontró, luchó con él y le cambió el nombre a Israel.", "Dios puede transformar a una persona por completo.", ["Génesis 28:12-15", "Génesis 32:24-28"]], ["José", "🧥", "Hijo de Jacob, vendido por sus hermanos.", "Esclavo y preso en Egipto, Dios lo levantó como gobernador. Salvó a su familia del hambre y perdonó a sus hermanos.", "Dios convierte en bien lo que otros hicieron para mal.", ["Génesis 37:3-4", "Génesis 41:39-41", "Génesis 50:20"]], ["Moisés", "🌊", "El libertador y legislador de Israel.", "Salvado de bebé en el río, Dios lo llamó desde una zarza ardiente para sacar a Israel de Egipto y le dio los Diez Mandamientos.", "Dios usa a quien se siente incapaz.", ["Éxodo 3:10-12", "Éxodo 14:21", "Éxodo 20:1-3"]], ["Aarón", "🔥", "Hermano de Moisés y primer sumo sacerdote.", "Habló por Moisés ante el faraón y sirvió como sacerdote, aunque falló al hacer el becerro de oro.", "Hasta los líderes necesitan la gracia de Dios.", ["Éxodo 4:14-16", "Éxodo 32:1-4", "Éxodo 28:1"]], ["Miriam", "🥁", "Hermana de Moisés y profetisa.", "Cuidó a Moisés en el río y dirigió a las mujeres en alabanza después de cruzar el mar Rojo.", "Celebrar a Dios por sus victorias.", ["Éxodo 2:4-8", "Éxodo 15:20-21"]], ["Josué", "🎺", "Ayudante de Moisés y líder que llevó a Israel a la tierra prometida.", "Confió en Dios para cruzar el Jordán y conquistar Jericó, y animó al pueblo a servir solo al Señor.", "Esfuérzate y sé valiente, porque Dios va contigo.", ["Josué 1:9", "Josué 6:20", "Josué 24:15"]], ["Rahab", "🧵", "Mujer de Jericó que escondió a los espías de Israel.", "Arriesgó su vida por creer en el Dios de Israel. Ella y su familia se salvaron y aparece en la genealogía de Jesús.", "Nadie está demasiado lejos para la gracia de Dios.", ["Josué 2:8-11", "Josué 6:25", "Hebreos 11:31"]], ["Débora", "⚖️", "Profetisa y jueza de Israel.", "Juzgaba al pueblo bajo una palmera y animó a Barac a pelear contra los cananeos, y Dios les dio la victoria.", "Dios usa a mujeres y hombres valientes.", ["Jueces 4:4-9", "Jueces 5:1-3"]], ["Gedeón", "🏺", "Juez de Israel que se sentía el más pequeño.", "Dios lo llamó varón esforzado y con solo 300 hombres venció a los madianitas.", "La victoria viene de Dios, no del número.", ["Jueces 6:12-16", "Jueces 7:7"]], ["Sansón", "💪", "Juez de Israel con una fuerza extraordinaria.", "Dios le dio gran fuerza, pero su desobediencia lo llevó a la derrota. Al final clamó a Dios y venció a los filisteos.", "Los dones de Dios se cuidan con obediencia.", ["Jueces 13:24-25", "Jueces 16:17-20", "Jueces 16:28-30"]], ["Rut", "🌾", "Mujer moabita, bisabuela del rey David.", "Se quedó fiel con su suegra Noemí, trabajó en los campos de Booz y fue redimida por él.", "La lealtad y la fidelidad traen bendición.", ["Rut 1:16-17", "Rut 2:11-12", "Rut 4:13-17"]], ["Ana", "🙏", "Madre del profeta Samuel.", "Oraba con lágrimas porque no podía tener hijos. Dios la escuchó y ella dedicó a Samuel al servicio de Dios.", "Dios escucha las oraciones sinceras.", ["1 Samuel 1:10-11", "1 Samuel 1:27-28"]], ["Samuel", "📯", "Profeta, sacerdote y último juez de Israel.", "Escuchó la voz de Dios desde niño y ungió a los primeros reyes, Saúl y David.", "Habla, Señor, que tu siervo escucha.", ["1 Samuel 3:10", "1 Samuel 16:13"]], ["Saúl", "👑", "El primer rey de Israel.", "Era alto y prometedor, pero desobedeció a Dios y fue rechazado como rey.", "Obedecer es mejor que los sacrificios.", ["1 Samuel 10:24", "1 Samuel 15:22-23"]], ["David", "🪨", "Pastor, músico, guerrero y rey de Israel.", "Venció a Goliat confiando en Dios, escribió muchos salmos y fue llamado varón conforme al corazón de Dios. Cuando pecó, se arrepintió de verdad.", "Dios mira el corazón.", ["1 Samuel 16:7", "1 Samuel 17:45", "Salmos 51:10"]], ["Jonatán", "🤝", "Hijo del rey Saúl y gran amigo de David.", "Amó a David como a sí mismo y lo protegió de su propio padre.", "La verdadera amistad es leal y desinteresada.", ["1 Samuel 18:1-3", "1 Samuel 20:42"]], ["Salomón", "🏛️", "Hijo de David, el rey más sabio.", "Pidió sabiduría a Dios, construyó el templo y escribió proverbios, pero al final su corazón se desvió.", "Empezar bien no basta: hay que terminar bien.", ["1 Reyes 3:9-12", "1 Reyes 11:4"]], ["Elías", "🔥", "Profeta valiente en tiempos del rey Acab.", "Desafió a los profetas de Baal en el monte Carmelo y Dios respondió con fuego. Luego se desanimó y Dios lo cuidó con ternura.", "Dios cuida a sus siervos aun en el desánimo.", ["1 Reyes 18:36-39", "1 Reyes 19:4-8"]], ["Eliseo", "🧥", "Profeta que siguió a Elías.", "Pidió una doble porción del espíritu de Elías e hizo muchos milagros, como multiplicar el aceite y sanar a Naamán.", "Dios sigue obrando de generación en generación.", ["2 Reyes 2:9-12", "2 Reyes 5:14"]], ["Ezequías", "🛡️", "Rey de Judá que confió en Dios.", "Restauró el templo, oró ante la amenaza de Asiria y Dios lo libró. También le añadió quince años de vida.", "La oración cambia situaciones imposibles.", ["2 Reyes 18:5-6", "2 Reyes 19:14-19", "2 Reyes 20:5-6"]], ["Josías", "📜", "Rey de Judá que empezó a reinar a los 8 años.", "Al encontrar el libro de la ley, se arrepintió y guió a todo el pueblo a volver a Dios.", "La Palabra de Dios trae avivamiento.", ["2 Reyes 22:1-2", "2 Reyes 23:25"]], ["Isaías", "🕊️", "Profeta de Judá.", "Vio la gloria de Dios en el templo y dijo: «Heme aquí, envíame a mí». Anunció la venida del Mesías.", "Responder al llamado de Dios.", ["Isaías 6:8", "Isaías 53:5"]], ["Jeremías", "😢", "El profeta llorón.", "Dios lo llamó desde joven. Predicó durante años sin ser escuchado y sufrió mucho, pero siguió fiel.", "La fidelidad vale más que el éxito.", ["Jeremías 1:5-8", "Jeremías 20:9"]], ["Daniel", "🦁", "Joven judío llevado cautivo a Babilonia.", "Fue fiel a Dios en la comida, en la oración y ante los reyes. Dios lo libró del foso de los leones.", "Ser fiel a Dios en un ambiente difícil.", ["Daniel 1:8", "Daniel 6:10", "Daniel 6:22"]], ["Sadrac, Mesac y Abed-nego", "🔥", "Los tres amigos de Daniel.", "Se negaron a adorar la estatua del rey. Fueron echados al horno de fuego, pero Dios los libró.", "Dios está con nosotros en el fuego.", ["Daniel 3:17-18", "Daniel 3:25"]], ["Ester", "👸", "Joven judía que llegó a ser reina de Persia.", "Arriesgó su vida presentándose ante el rey para salvar a su pueblo de la destrucción.", "Dios te puso donde estás con un propósito.", ["Ester 4:14", "Ester 4:16"]], ["Nehemías", "🧱", "Copero del rey de Persia.", "Oró, pidió permiso al rey y dirigió la reconstrucción de los muros de Jerusalén en 52 días.", "La oración y el trabajo van juntos.", ["Nehemías 1:4", "Nehemías 2:4-5", "Nehemías 6:15"]], ["Job", "💔", "Hombre justo que lo perdió todo.", "Sufrió la pérdida de sus hijos, bienes y salud, pero no maldijo a Dios. Al final Dios le habló y lo restauró.", "Confiar en Dios aunque no entendamos.", ["Job 1:20-22", "Job 19:25", "Job 42:10"]], ["Jonás", "🐋", "Profeta que huyó de Dios.", "No quiso ir a Nínive, fue tragado por un gran pez, oró y obedeció. Nínive se arrepintió.", "Dios es misericordioso con todos.", ["Jonás 1:3", "Jonás 2:1-2", "Jonás 4:2"]], ["María", "💙", "La madre de Jesús.", "Una joven humilde de Nazaret que aceptó el plan de Dios: «He aquí la sierva del Señor».", "Decir sí a Dios con humildad.", ["Lucas 1:30-31", "Lucas 1:38", "Lucas 2:19"]], ["José de Nazaret", "🪚", "Carpintero, esposo de María.", "Era un hombre justo que obedeció a Dios en sueños: recibió a María, protegió al niño y huyó a Egipto.", "La obediencia silenciosa también es grande.", ["Mateo 1:19-24", "Mateo 2:13-14"]], ["Juan el Bautista", "🏞️", "Profeta que preparó el camino de Jesús.", "Predicaba arrepentimiento en el desierto y bautizó a Jesús. Dijo: «Es necesario que él crezca y que yo mengüe».", "Señalar a Jesús, no a nosotros.", ["Mateo 3:1-3", "Juan 1:29", "Juan 3:30"]], ["Pedro", "🎣", "Pescador y uno de los doce apóstoles.", "Impulsivo y apasionado: caminó sobre el agua, negó a Jesús tres veces y fue restaurado. Predicó en Pentecostés.", "Jesús restaura a los que fallan.", ["Mateo 14:28-31", "Lucas 22:61-62", "Hechos 2:38-41"]], ["Andrés", "🐟", "Pescador, hermano de Pedro.", "Fue de los primeros en seguir a Jesús y enseguida llevó a su hermano a conocerlo.", "Llevar a otros a Jesús.", ["Juan 1:40-42", "Juan 6:8-9"]], ["Juan", "❤️", "Apóstol, «el discípulo a quien Jesús amaba».", "Pescador que llegó a escribir un evangelio, tres cartas y el Apocalipsis. Cuidó de María, la madre de Jesús.", "El amor de Dios transforma el carácter.", ["Juan 19:26-27", "1 Juan 4:7-8"]], ["Santiago", "⚔️", "Apóstol, hermano de Juan.", "Fue testigo de la transfiguración y el primer apóstol en morir por su fe.", "Seguir a Jesús cueste lo que cueste.", ["Marcos 1:19-20", "Hechos 12:1-2"]], ["Mateo", "💰", "Cobrador de impuestos que se hizo apóstol.", "Dejó su mesa de impuestos para seguir a Jesús y escribió el primer evangelio.", "Jesús llama a los que otros desprecian.", ["Mateo 9:9-13"]], ["Tomás", "🤔", "Uno de los doce apóstoles.", "Dudó de la resurrección hasta ver a Jesús, y entonces dijo: «¡Señor mío, y Dios mío!».", "Jesús nos encuentra en nuestras dudas.", ["Juan 20:24-29"]], ["Judas Iscariote", "🪙", "El apóstol que traicionó a Jesús.", "Estuvo con Jesús tres años, pero amaba el dinero y lo entregó por treinta piezas de plata.", "Estar cerca de Jesús no basta: hay que entregarle el corazón.", ["Mateo 26:14-16", "Juan 12:4-6"]], ["María Magdalena", "🌸", "Seguidora fiel de Jesús.", "Jesús la liberó de siete demonios. Estuvo en la cruz y fue la primera en ver a Jesús resucitado.", "Quien mucho ha sido perdonado, mucho ama.", ["Lucas 8:1-2", "Juan 20:15-18"]], ["Marta y María", "🏠", "Hermanas de Lázaro, amigas de Jesús.", "Marta servía afanada mientras María escuchaba a los pies de Jesús. Jesús dijo que María escogió la buena parte.", "Primero estar con Jesús, luego hacer.", ["Lucas 10:38-42", "Juan 11:20-27"]], ["Lázaro", "🪦", "Amigo de Jesús, hermano de Marta y María.", "Murió y smite en familia.", ["2 Timoteo 1:5", "1 Timoteo 4:12"]], ["Lidia", "🟣", "Comerciante de púrpura en Filipos.", "El Señor abrió su corazón al escuchar a Pablo; se bautizó con su familia y abrió su casa a la iglesia.", "Un corazón abierto y una casa abierta.", ["Hechos 16:14-15"]], ["Priscila y Aquila", "⛺", "Matrimonio que hacía tiendas.", "Trabajaron con Pablo, enseñaron con amor a Apolos y tuvieron una iglesia en su casa.", "Servir a Dios juntos como pareja.", ["Hechos 18:2-3", "Hechos 18:26"]], ["Cornelio", "🎖️", "Centurión romano piadoso.", "Oraba y ayudaba a los pobres. Dios envió a Pedro a su casa y fue de los primeros gentiles en recibir el Espíritu Santo.", "Dios no hace acepción de personas.", ["Hechos 10:1-4", "Hechos 10:34-35"]]];
