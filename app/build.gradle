plugins {
    id 'com.android.application'
}

android {
    namespace 'com.misdevocionales.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.misdevocionales.app'
        minSdk 24
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName '1.' + (System.getenv('VERSION_CODE') ?: '0')
    }

    // Firma fija: todas las versiones se firman con la misma llave para poder instalarse una encima de otra.
    signingConfigs {
        fija {
            storeFile file('misdevocionales.keystore')
            storePassword 'misdevocionales'
            keyAlias 'misdevocionales'
            keyPassword 'misdevocionales'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.fija }
        release { minifyEnabled false; signingConfig signingConfigs.fija }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress 'json', 'webp'
    }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.8.0'
    implementation 'androidx.webkit:webkit:1.11.0'
}
